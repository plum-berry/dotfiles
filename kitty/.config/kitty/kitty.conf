# Fonts

font_familty FiraCode Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0 

# Window layout
remember_window_size no
initial_width   940
initial_height  600
window_padding_width 10
hide_window_decorations yes
confirm_OS_window_close 0


# Mous and coursor

